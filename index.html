<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[Your Name] · Personal Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="profile-header">
    <div class="profile-header__identity">
      <div class="avatar">
        <!-- Swap this for <img src="..." alt="[Your Name]"> once you have a photo. -->
        <span class="avatar__label">[Photo]</span>
      </div>
      <div class="profile-header__text">
        <h1 class="profile-name">Ethan Luu</h1>
        <p class="profile-bio">[One or two sentence description of yourself.]</p>
      </div>
    </div>

    <div class="level-badge">
      <span class="level-badge__label">Level</span>
      <span class="level-badge__value" aria-label="Level 23">23</span>
    </div>
  </header>

  <div class="page-body">

    <main class="main-column">
      <section aria-labelledby="projects-heading">
        <h2 id="projects-heading">Recent Projects</h2>

        <div class="project-list" id="project-list">
          <p class="project-list__status">Loading recent projects&hellip;</p>
        </div>
        <noscript>
          <p>Enable JavaScript to see recent projects pulled live from GitHub, or <a href="https://github.com/eluu02?tab=repositories">view them directly on GitHub</a>.</p>
        </noscript>

        <p class="view-all"><a href="https://github.com/eluu02?tab=repositories">View all recent projects</a></p>
      </section>
    </main>

    <aside class="sidebar" aria-label="Site sections">
      <nav>
        <ul class="sidebar-nav">
          <li><a href="about.html">About</a></li>
          <li><a href="https://github.com/eluu02">GitHub</a></li>
          <li><a href="contact.html">Contact Information</a></li>
        </ul>
      </nav>
    </aside>

  </div>

  <script src="projects.js" defer></script>

</body>
</html>
